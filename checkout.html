<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Đặt hàng - Parfumerie</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

    <header>

        <div class="logo">
            PARFUMERIE
        </div>

        <nav>

            <a href="index.html">
                Trang chủ
            </a>

            <a href="products.html">
                Sản phẩm
            </a>

        </nav>

    </header>


    <main>

        <section class="checkout-page">

            <h1>
                THÔNG TIN ĐẶT HÀNG
            </h1>


            <div class="checkout-container">


                <!-- THÔNG TIN NGƯỜI NHẬN -->

                <div class="checkout-form">

                    <h2>
                        Thông tin nhận hàng
                    </h2>


                    <label>
                        Họ và tên
                    </label>

                    <input
                        type="text"
                        placeholder="Nhập họ tên"
                    >


                    <label>
                        Số điện thoại
                    </label>

                    <input
                        type="text"
                        placeholder="Nhập số điện thoại"
                    >


                    <label>
                        Địa chỉ
                    </label>

                    <textarea
                        placeholder="Nhập địa chỉ nhận hàng">
                    </textarea>


                    <h2>
                        Phương thức thanh toán
                    </h2>


                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment"
                            checked
                        >

                        Thanh toán khi nhận hàng

                    </label>


                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment"
                        >

                        Chuyển khoản ngân hàng

                    </label>


                    <button class="order-btn">
                        ĐẶT HÀNG
                    </button>

                </div>


                <!-- TỔNG ĐƠN -->

                <div class="order-summary">

                    <h2>
                        Đơn hàng
                    </h2>

                    <p>
                        Chanel Coco Mademoiselle
                        <span>2.500.000đ</span>
                    </p>

                    <p>
                        Dior Sauvage
                        <span>3.000.000đ</span>
                    </p>

                    <hr>

                    <h3>
                        Tổng cộng:
                        5.500.000đ
                    </h3>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 PARFUMERIE
        </p>

    </footer>

</body>

</html>
