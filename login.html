<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - Parfumerie</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

    <header>

        <div class="logo">
            PARFUMERIE
        </div>

        <nav>

            <a href="index.html">
                Trang chủ
            </a>

            <a href="products.html">
                Sản phẩm
            </a>

        </nav>

        <div class="header-right">

            <a href="register.html">
                Đăng ký
            </a>

        </div>

    </header>


    <main>

        <section class="auth-page">

            <div class="auth-box">

                <h1>
                    ĐĂNG NHẬP
                </h1>


                <form>

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        placeholder="Nhập email"
                        required
                    >


                    <label>
                        Mật khẩu
                    </label>

                    <input
                        type="password"
                        placeholder="Nhập mật khẩu"
                        required
                    >


                    <button type="submit">
                        ĐĂNG NHẬP
                    </button>

                </form>


                <p>
                    Chưa có tài khoản?
                    <a href="register.html">
                        Đăng ký
                    </a>
                </p>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 PARFUMERIE
        </p>

    </footer>

</body>

</html>
