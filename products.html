<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sản phẩm - Parfumerie</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo">
            PARFUMERIE
        </div>

        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="products.html">Sản phẩm</a>
            <a href="#">Thương hiệu</a>
            <a href="#">Nam</a>
            <a href="#">Nữ</a>
        </nav>

        <div class="header-right">
            <a href="login.html">Đăng nhập</a>
            <a href="cart.html">Giỏ hàng</a>
        </div>

    </header>


    <!-- NỘI DUNG SẢN PHẨM -->
    <main>

        <section class="products-page">

            <h1>
                TẤT CẢ SẢN PHẨM
            </h1>


            <!-- TÌM KIẾM -->
            <div class="search-box">

                <input
                    type="text"
                    placeholder="Tìm kiếm sản phẩm..."
                >

                <button>
                    Tìm kiếm
                </button>

            </div>


            <!-- BỘ LỌC -->
            <div class="filter-box">

                <select>
                    <option value="">
                        Thương hiệu
                    </option>

                    <option>
                        Chanel
                    </option>

                    <option>
                        Dior
                    </option>

                    <option>
                        Gucci
                    </option>

                    <option>
                        YSL
                    </option>
                </select>


                <select>
                    <option value="">
                        Giới tính
                    </option>

                    <option>
                        Nam
                    </option>

                    <option>
                        Nữ
                    </option>

                    <option>
                        Unisex
                    </option>
                </select>


                <select>
                    <option value="">
                        Mức giá
                    </option>

                    <option>
                        Dưới 1.000.000đ
                    </option>

                    <option>
                        1.000.000đ - 3.000.000đ
                    </option>

                    <option>
                        Trên 3.000.000đ
                    </option>
                </select>

            </div>


            <!-- DANH SÁCH SẢN PHẨM -->
            <div class="product-grid">


                <!-- SẢN PHẨM 1 -->
                <div class="product-card">

                    <img
                        src="images/product1.jpg"
                        alt="Chanel Coco Mademoiselle"
                    >

                    <h3>
                        Chanel Coco Mademoiselle
                    </h3>

                    <p>
                        2.500.000đ
                    </p>

                    <a href="product-detail.html">
                        Xem chi tiết
                    </a>

                </div>


                <!-- SẢN PHẨM 2 -->
                <div class="product-card">

                    <img
                        src="images/product2.jpg"
                        alt="Dior Sauvage"
                    >

                    <h3>
                        Dior Sauvage
                    </h3>

                    <p>
                        3.000.000đ
                    </p>

                    <a href="product-detail.html">
                        Xem chi tiết
                    </a>

                </div>


                <!-- SẢN PHẨM 3 -->
                <div class="product-card">

                    <img
                        src="images/product3.jpg"
                        alt="Gucci Guilty"
                    >

                    <h3>
                        Gucci Guilty
                    </h3>

                    <p>
                        2.800.000đ
                    </p>

                    <a href="product-detail.html">
                        Xem chi tiết
                    </a>

                </div>


                <!-- SẢN PHẨM 4 -->
                <div class="product-card">

                    <img
                        src="images/product4.jpg"
                        alt="YSL Libre"
                    >

                    <h3>
                        YSL Libre
                    </h3>

                    <p>
                        2.700.000đ
                    </p>

                    <a href="product-detail.html">
                        Xem chi tiết
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 PARFUMERIE
        </p>

    </footer>

</body>

</html>
